version: '3.8'

services:
  backend:
    build: ./backend
    restart: always
    environment:
      - DATABASE_URL=file:/app/prisma/dev.db
      - PORT=3000
    volumes:
      - ./backend/prisma:/app/prisma
      - ./backend/uploads:/app/uploads 
  
  frontend:
    build: ./frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend